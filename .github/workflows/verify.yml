name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_ui_tests:
        description: Run the slower simulator UI suite
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  tests:
    name: Domain, store, and auth tests
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Show toolchain
        run: xcodebuild -version
      - name: Run tests
        run: |
          mkdir -p test-results
          sh scripts/test-core.sh --force-resolved-versions --parallel --num-workers 2 --xunit-output test-results/unit-tests.xml
      - name: Summarize unit tests
        if: always()
        run: python3 scripts/summarize-tests.py test-results/unit-tests.xml
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: warn

  ios-build:
    name: iOS Simulator build
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Show toolchain
        run: xcodebuild -version
      - name: Validate project
        run: plutil -lint HomeSchoolHelper.xcodeproj/project.pbxproj
      - name: Build app without signing
        run: sh scripts/build-ios.sh

  ui-tests:
    if: github.event_name == 'workflow_dispatch' && inputs.run_ui_tests
    name: iOS UI tests (${{ matrix.device }})
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone 17, iPhone 16e]
    env:
      HSH_TEST_DESTINATION: platform=iOS Simulator,name=${{ matrix.device }},OS=26.2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode and inspect simulators
        run: |
          sudo xcode-select --switch "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun simctl list devices available
      - name: Run family workflow and accessibility smoke tests
        run: sh scripts/test-ui.sh -resultBundlePath .build/ui-tests.xcresult
      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results-${{ matrix.device }}
          path: .build/ui-tests.xcresult
          retention-days: 7
          if-no-files-found: warn
