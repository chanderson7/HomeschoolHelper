name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  tests:
    name: Domain, store, and auth tests
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Show toolchain
        run: xcodebuild -version
      - name: Run tests
        run: |
          mkdir -p test-results
          sh scripts/test-core.sh --force-resolved-versions --parallel --num-workers 2 --xunit-output test-results/unit-tests.xml
      - name: Summarize unit tests
        if: always()
        run: python3 scripts/summarize-tests.py test-results/unit-tests.xml
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: warn

  ios-build:
    name: iOS Simulator build
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Show toolchain
        run: xcodebuild -version
      - name: Validate project
        run: plutil -lint HomeSchoolHelper.xcodeproj/project.pbxproj
      - name: Build app without signing
        run: sh scripts/build-ios.sh
