name: UI Verify

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-verify-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  ui-tests:
    name: iOS UI tests (${{ matrix.device }})
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone 17, iPhone 16e]
    env:
      HSH_TEST_DESTINATION: platform=iOS Simulator,name=${{ matrix.device }},OS=26.2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode and inspect simulators
        run: |
          sudo xcode-select --switch "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun simctl list devices available
      - name: Run family workflow and accessibility smoke tests
        run: sh scripts/test-ui.sh -resultBundlePath .build/ui-tests.xcresult
      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results-${{ matrix.device }}
          path: .build/ui-tests.xcresult
          retention-days: 7
          if-no-files-found: warn
