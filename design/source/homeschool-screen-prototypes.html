:hidden}#hh-ios .track span{display:block;height:100%;background:var(--hh-accent);border-radius:9px}#hh-ios .list{background:var(--hh-card);border-radius:19px;padding:0 15px}#hh-ios .item{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--hh-line);min-height:68px}#hh-ios .item:last-child{border-bottom:0}#hh-ios .item strong{font-size:15px;font-weight:600}#hh-ios .item small{display:block;color:var(--hh-muted);font-size:12px;margin-top:5px}#hh-ios .item .grow{flex:1}#hh-ios .check{width:25px;height:25px;accent-color:var(--hh-accent);flex-shrink:0}#hh-ios .primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;background:var(--hh-accent);color:var(--hh-on);padding:14px 12px;border-radius:15px;margin-top:16px;font-size:15px;font-weight:600;min-height:48px}#hh-ios .secondary{background:var(--hh-card);color:var(--hh-accent)}#hh-ios nav{background:var(--hh-card);display:flex;justify-content:space-around;border-top:1px solid var(--hh-line);padding:10px 8px 4px}#hh-ios nav button{border:0;background:none;display:flex;align-items:center;flex-direction:column;gap:5px;font-size:11px;min-width:59px;min-height:48px;color:var(--hh-muted)}#hh-ios nav button.active{color:var(--hh-accent);font-weight:700}#hh-ios nav svg{width:21px;height:21px}#hh-ios .homebar{height:5px;width:110px;border-radius:7px;background:var(--hh-ink);margin:10px auto;background-clip:content-box}#hh-ios .bottom{background:var(--hh-card);padding:1px 0 4px}#hh-ios .daystrip{display:flex;justify-content:space-between;gap:5px;margin:20px 0}#hh-ios .day{flex:1;text-align:center;padding:9px 2px;border-radius:16px;background:var(--hh-card);font-size:11px;color:var(--hh-muted)}#hh-ios .day b{display:block;font-size:18px;margin-top:7px;color:var(--hh-ink)}#hh-ios .day.selected{background:var(--hh-accent);color:var(--hh-on)}#hh-ios .day.selected b{color:var(--hh-on)}#hh-ios .badge{font-size:11px;background:var(--hh-soft);padding:5px 8px;border-radius:9px;white-space:nowrap}#hh-ios .avatar{height:37px;width:37px;border-radius:13px;background:var(--hh-soft);display:grid;place-items:center;font-size:14px;font-weight:650;flex-shrink:0}#hh-ios .menu{width:100%;text-align:left;border:0;background:none;display:flex;align-items:center;gap:12px;padding:0}#hh-ios .paper{background:var(--hh-card);border:1px solid var(--hh-line);padding:23px 17px;border-radius:5px;margin:16px 0;box-shadow:0 5px 18px #00000007}#hh-ios .paper h3{text-align:center;font-family:Georgia,serif;font-size:18px;margin:5px 0 19px}#hh-ios .paper table{width:100%;border-collapse:collapse;font-size:12px;margin:17px 0}#hh-ios .paper td,#hh-ios .paper th{text-align:left;padding:9px 2px;border-bottom:1px solid var(--hh-line)}#hh-ios .paper th{font-size:10px;text-transform:uppercase;color:var(--hh-muted)}#hh-ios .paper p{font-size:11px}#hh-ios .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:14px}#hh-ios .cal span{display:grid;place-items:center;aspect-ratio:1;border-radius:9px;font-size:12px}#hh-ios .cal .yes{background:var(--hh-soft);color:var(--hh-accent)}#hh-ios .cal .today{background:var(--hh-accent);color:var(--hh-on)}#hh-ios .cal .weekday{aspect-ratio:auto;color:var(--hh-muted);font-size:10px}#hh-ios .notice{font-size:12px;padding:10px;border-radius:10px;background:var(--hh-soft);margin-top:12px}#hh-ios label.field{display:block;font-size:12px;color:var(--hh-muted);margin-top:18px}#hh-ios input[type=text],#hh-ios select{display:block;width:100%;padding:13px;background:var(--hh-card);color:var(--hh-ink);border:1px solid var(--hh-line);border-radius:12px;font:inherit;font-size:16px;margin-top:7px}#hh-ios .balance{font-size:34px;letter-spacing:-1px}#hh-ios .caption{text-align:center;font-size:11px;color:var(--hh-muted);margin:10px 0 0}

<div class="phone"><div class="status"><span>9:41</span><span class="island"></span><span>● ▰</span></div><main></main><nav aria-label="App navigation"></nav><div class="bottom"><div class="homebar"></div></div></div><div class="caption">EZHomeschool · interactive iOS concept · sample family</div>

<script>
(()=>{const root=document.getElementById('hh-ios'),main=root.querySelector('main'),nav=root.querySelector('nav');let screen='Today',child='All',finished=new Set([0]),attendance=false,moved=false;const design={palette:'Sage',rounded:23};const icons={Today:'sun',Plan:'calendar-days',Records:'folder-open',Family:'users'};const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;const btn=(label,to,cls='primary')=>`<button class="${cls}" data-go="${to}">${label}</button>`;const row=(title,sub,right='',to='')=>`<div class="item">${to?`<button class="menu" data-go="${to}">`:''}<div class="grow"><strong>${title}</strong><small>${sub}</small></div>${right}${to?'</button>':''}</div>`;function render(){nav.innerHTML=Object.keys(icons).map(n=>`<button data-go="${n}" class="${screen===n||(['Attendance','Transcript','Budget','Reading','Grades'].includes(screen)&&n==='Records')?'active':''}">${icon(icons[n])}${n}</button>`).join('');let html='';if(screen==='Today'){const tasks=[['Read together','Charlotte’s Web · Chapter 4','Emma',20],['Fractions in everyday life','Math · Lesson 24','Emma',35],['The water cycle','Science · Nature journal','Noah',30],['Letter sounds','Reading · Lesson 12','Noah',20]];html=`<div class="row"><span class="eyebrow">Monday, September 21</span><span class="avatar">A</span></div><h1>A little learning.<br>A lovely day.</h1><div class="chips">${['All','Emma','Noah'].map(n=>`<button class="chip" data-child="${n}" aria-pressed="${child===n}">${n==='All'?'All children':n}</button>`).join('')}</div><div class="hero"><div class="row"><div><span class="eyebrow">Family progress</span><strong>${finished.size} of 4 lessons done</strong></div>${icon('sprout')}</div><p>One small step at a time.</p><div class="track"><span style="width:${finished.size*25}%"></span></div></div><div class="row"><h2>Your next steps</h2><button class="plain" data-go="Plan">View plan</button></div><div class="list">${tasks.map((t,i)=>child==='All'||child===t[2]?`<label class="item"><input class="check" type="checkbox" data-task="${i}" ${finished.has(i)?'checked':''}><span class="grow"><strong style="${finished.has(i)?'text-decoration:line-through;opacity:.6':''}">${t[0]}</strong><small>${t[2]} · ${t[1]}</small></span><small>${t[3]}m</small></label>`:'').join('')}</div>${btn(attendance?'Attendance recorded ✓':'Review today’s attendance','Attendance')}<button class="plain" data-go="Reschedule">Plans changed? Move unfinished lessons →</button>`;}else if(screen==='Plan'){html=`<span class="eyebrow">Room for real life</span><h1>Your week</h1><p>September 21–25, 2026</p><div class="daystrip">${['M','T','W','T','F'].map((n,i)=>`<div class="day ${i===0?'selected':''}">${n}<b>${21+i}</b></div>`).join('')}</div><div class="hero"><span class="eyebrow">Flexible planning</span><strong>Keep the next lesson ready.</strong><p>Work in order, at your family’s pace.</p></div><h2>Monday’s lessons</h2><div class="list">${row('Math · Emma','Lesson 24 · Fractions','<span class="badge">35 min</span>')}${row('Science · Noah','The water cycle','<span class="badge">30 min</span>')}${row('Reading · Noah','Lesson 12 · Letter sounds','<span class="badge">20 min</span>')}</div>${btn('＋ Build a lesson sequence','Add')}${btn('Move unfinished lessons','Reschedule','primary secondary')}`;}else if(screen==='Add'){html=`<button class="plain" data-go="Plan">← Your week</button><h1>A plan in minutes</h1><p>Start with a simple lesson sequence.</p><label class="field">Course<input type="text" value="Math" aria-label="Course"></label><label class="field">Student<select aria-label="Student"><option>Emma</option><option>Noah</option></select></label><label class="field">Lessons<input type="text" value="Lessons 25–60" aria-label="Lessons"></label><label class="field">School days<select><option>Monday, Wednesday, Friday</option><option>Every weekday</option></select></label><div class="hero"><strong>36 lessons. One step.</strong><p>Each school day gets the next lesson. You can change individual lessons later.</p></div>${btn('Preview lesson sequence','Sequence')}`;}else if(screen==='Sequence'){html=`<button class="plain" data-go="Add">← Edit sequence</button><h1>Your sequence</h1><p>Emma · Math · Monday, Wednesday, Friday</p><div class="list">${row('Lesson 25','Wednesday, September 23')}${row('Lesson 26','Friday, September 25')}${row('Lesson 27','Monday, September 28')}</div><div class="hero"><strong>33 more lessons</strong><p>Continue in order on your selected school days.</p></div>${btn('Save sample plan','Plan')}<p>Concept preview only.</p>`;}else if(screen==='Reschedule'){html=`<button class="plain" data-go="Plan">← Your week</button><h1>Make room<br>for life.</h1><p>Move unfinished work forward. Completed lessons stay where they are.</p><div class="hero"><span class="eyebrow">Preview changes</span><strong>${moved?'Your plan has shifted.':'3 lessons move to Tuesday'}</strong><p>Later lessons follow in order. Weekends and days off are skipped.</p></div><div class="list">${row('Math · Lesson 24','Mon, Sep 21 → Tue, Sep 22')}${row('Science · Water cycle','Mon, Sep 21 → Tue, Sep 22')}${row('Reading · Lesson 12','Mon, Sep 21 → Tue, Sep 22')}</div><button class="primary" data-move="1">${moved?'Undo sample reschedule':'Confirm changes'}</button>${btn('Back to today','Today','primary secondary')}`;}else if(screen==='Records'){html=`<span class="eyebrow">Everything you’ve done</span><h1>Small moments.<br>Real progress.</h1><div class="hero"><span class="eyebrow">2026–27 school year</span><strong>${attendance?'25':'24'} days of learning</strong><p>Your records grow as you go.</p></div><h2>Learning records</h2><div class="list">${row('Attendance & hours','Review days and learning time',icon('chevron-right'),'Attendance')}${row('Grades & report cards','Course averages at a glance',icon('chevron-right'),'Grades')}${row('Transcripts','Preview a clean, printable record',icon('chevron-right'),'Transcript')}${row('Reading log','Books, pages, and discoveries',icon('chevron-right'),'Reading')}</div><h2>Family spending</h2><div class="list">${row('Budget & expenses','$248 of $600 used',icon('chevron-right'),'Budget')}</div>`;}else if(screen==='Attendance'){html=`<button class="plain" data-go="Records">← Records</button><h1>Every day counts.</h1><p>Emma · September 2026</p><div class="hero"><div class="row"><div><span class="eyebrow">School year</span><strong>${attendance?'25':'24'} days</strong></div><div><span class="eyebrow">Recorded</span><strong>${attendance?'85':'82'} hours</strong></div></div></div><div class="list" style="padding:16px"><span class="eyebrow">September</span><div class="cal">${['M','T','W','T','F','S','S'].map(x=>`<span class="weekday">${x}</span>`).join('')}<span></span>${Array.from({length:30},(_,i)=>`<span class="${i===20?'today':i<19&&(i+1)%7<5?'yes':''}">${i+1}</span>`).join('')}</div></div><h2>Confirm today</h2><div class="list">${row('Emma','Monday, September 21','<span class="badge">3 hours</span>')}</div><button class="primary" data-attend="1">${attendance?'Recorded ✓ · Undo':'Confirm attendance'}</button><p>Review hours before adding them to your record.</p>`;}else if(screen==='Grades'){html=`<button class="plain" data-go="Records">← Records</button><h1>Growing every day</h1><p>Emma · Fall semester</p><div class="hero"><span class="eyebrow">Course progress</span><strong>A strong start.</strong><p>3 courses with recorded assignments.</p></div><div class="list">${row('Mathematics','8 assignments graded','<strong>94% · A</strong>')}${row('Language arts','6 assignments graded','<strong>91% · A−</strong>')}${row('Science','5 assignments graded','<strong>88% · B+</strong>')}</div><h2>Latest work</h2><div class="list">${row('Fractions practice','Mathematics · Sep 18','<span class="badge">18 / 20</span>')}</div>${btn('Preview sample transcript','Transcript')}`;}else if(screen==='Transcript'){html=`<button class="plain" data-go="Records">← Records</button><h1>Ready to share.</h1><p>High school transcript · illustrative student</p><div class="paper"><p style="text-align:center;letter-spacing:2px">ANDERSON HOME SCHOOL</p><h3>Academic Transcript</h3><div class="row"><strong style="font-size:13px">Emma Anderson</strong><span class="badge">Sample</span></div><p>Grade 9 · Academic year 2026–27</p><table><thead><tr><th>Course</th><th>Grade</th><th>Credit</th></tr></thead><tbody><tr><td>Algebra I</td><td>A</td><td>1.0</td></tr><tr><td>English I</td><td>A−</td><td>1.0</td></tr><tr><td>Biology</td><td>B+</td><td>1.0</td></tr></tbody></table><div class="row"><p>Unweighted GPA<br><strong style="font-size:22px;color:var(--hh-ink)">3.67</strong></p><p>Credits earned<br><strong style="font-size:22px;color:var(--hh-ink)">3.0</strong></p></div><p style="margin-top:30px">Parent / educator signature __________________</p></div><button class="primary" data-export="1">${icon('share')} Export PDF</button><div id="hh-export" aria-live="polite"></div><p>Choose courses, grading scale, and signature before exporting.</p>`;}else if(screen==='Budget'){html=`<button class="plain" data-go="Records">← Records</button><h1>A little more clarity.</h1><p>Your homeschool budget · 2026–27</p><div class="hero"><span class="eyebrow">Remaining budget</span><div class="balance">$352<span style="font-size:18px">.00</span></div><p>$248 spent of $600 planned</p><div class="track"><span style="width:41.3%"></span></div></div><h2>Recent expenses</h2><div class="list">${row('Math workbooks','Curriculum · Sep 18','<strong>$86</strong>')}${row('Science museum','Field trips · Sep 15','<strong>$42</strong>')}${row('Reading collection','Books · Sep 10','<strong>$120</strong>')}</div>${btn('＋ Add an expense','Expense')}`;}else if(screen==='Expense'){html=`<button class="plain" data-go="Budget">← Budget</button><h1>Keep the details.</h1><label class="field">Description<input type="text" value="Art supplies"></label><label class="field">Amount<input type="text" value="$24.00"></label><label class="field">Category<select><option>Supplies</option><option>Curriculum</option><option>Field trips</option></select></label><div class="hero"><strong>Receipts in one place.</strong><p>A future camera flow can attach a receipt to this expense.</p></div>${btn('Back to sample budget','Budget')}`;}else if(screen==='Reading'){html=`<button class="plain" data-go="Records">← Records</button><h1>One more chapter.</h1><p>Emma’s reading log</p><div class="hero"><span class="eyebrow">Reading now</span><strong>Charlotte’s Web</strong><p>E. B. White · Chapter 4 of 22</p><div class="track"><span style="width:18%"></span></div></div><h2>On the bookshelf</h2><div class="list">${row('The Wild Robot','Peter Brown · Finished September 12','<span class="badge">Finished</span>')}${row('Charlotte’s Web','E. B. White · Started September 18','<span class="badge">Reading</span>')}</div>${btn('Back to records','Records')}`;}else{html=`<span class="eyebrow">Your learning team</span><h1>Better together.</h1><p>The Anderson family</p><h2>Your children</h2><div class="list">${row('Emma','Grade 9 · 6 courses','<span class="avatar">E</span>')}${row('Noah','Grade 1 · 4 courses','<span class="avatar">N</span>')}</div><h2>Your household plan</h2><div class="hero"><span class="eyebrow">Proposed family plan</span><strong>$29 / year</strong><p>Planning, records, and transcripts for every child in your household.</p></div><div class="list">${row('Data stays yours','PDF and CSV export included')}${row('Made for your family','One household. Multiple children.')}</div>`;}main.innerHTML=html;if(globalThis.lucide)lucide.createIcons();}
root.addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go){screen=go.dataset.go;render();}const c=e.target.closest('[data-child]');if(c){child=c.dataset.child;render();}if(e.target.closest('[data-attend]')){attendance=!attendance;render();}if(e.target.closest('[data-move]')){moved=!moved;render();}if(e.target.closest('[data-export]')){root.querySelector('#hh-export').innerHTML='<div class="notice">PDF export preview — this concept does not generate or share a document.</div>';}});root.addEventListener('change',e=>{if(e.target.matches('[data-task]')){const i=Number(e.target.dataset.task);e.target.checked?finished.add(i):finished.delete(i);render();}});render();function restyle(){const palettes={Sage:['#365c45','#b4d0a4','#e6eddf','#324738'],Ocean:['#245d7c','#a3cce4','#e1edf3','#243e4c'],Plum:['#704361','#e0b6d3','#f1e5ee','#483346']},p=palettes[design.palette];root.style.setProperty('--hh-accent',`light-dark(${p[0]},${p[1]})`);root.style.setProperty('--hh-soft',`light-dark(${p[2]},${p[3]})`);root.querySelectorAll('.hero').forEach(el=>el.style.borderRadius=design.rounded+'px');}if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:restyle});tweak.addSelect(design,'palette',{label:'Color direction',options:['Sage','Ocean','Plum']});} })();
</script>

<script>
(()=>{const r=document.getElementById('hh-ios'),phone=r.querySelector('.phone'),main=phone.querySelector('main');
const screens=[['Today','Today','Check off lessons; filter by child; progress updates immediately.','Saved completion history and parent/student permissions.'],['Plan','Weekly plan','Open lesson setup and the missed-day preview.','Date-aware scheduling, school holidays, and saved courses.'],['Add','Build lessons','Edit course, child, lesson range, and weekdays.','Generate and store the full lesson sequence from entered values.'],['Sequence','Sequence preview','Review the example sequence and return to the plan.','Save the customized sequence and copy it between children.'],['Reschedule','Missed-day recovery','Confirm and undo a sample change.','Move actual unfinished lessons, resolve conflicts, and preserve history.'],['Records','Records hub','Navigate to attendance, grades, transcript, reading, and budget.','Aggregate real records across years.'],['Attendance','Attendance & hours','Confirm or undo attendance; totals change in the demo.','Edit historical entries and export days and instructional hours.'],['Grades','Grades & report cards','Inspect course averages and open transcript preview.','Grade entry, category weights, and report-card generation.'],['Transcript','Transcript preview','Inspect the document and open the demo export notice.','Generate a real PDF with configurable GPA and signature.'],['Reading','Reading log','View current and finished books.','Add books, update reading progress, and export the log.'],['Budget','Budget & expenses','Add an expense and see the remaining budget update.','Store receipts, filter spending, and export records.'],['Expense','Add expense','Save a description, positive amount, and category in demo memory.','Camera receipt attachment and durable storage.'],['Family','Family & pricing','Review student profiles and proposed household plan.','Manage family members, settings, account access, and billing.']];
let current='Today',gallery=false,expenses=[];
const header=document.createElement('div');header.className='prototype-nav';header.innerHTML='<span class="feature-status">EZHomeschool · iOS design study</span><h2>Your homeschool, one day at a time.</h2><div class="mode"><button class="primary" data-mode="interactive">Try the prototype</button><button class="primary secondary" data-mode="overview">See every screen</button></div><div class="screen-picks" aria-label="Prototype screens">'+screens.map((s,i)=>`<button data-go="${s[0]}" data-pick="${s[0]}">${String(i+1).padStart(2,'0')} ${s[1]}</button>`).join('')+'</div>';r.prepend(header);
const notes=document.createElement('div');notes.className='feature-notes';notes.setAttribute('aria-live','polite');r.append(notes);const overview=document.createElement('div');overview.className='overview';overview.hidden=true;r.append(overview);
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function update(){const s=screens.find(s=>s[0]===current)||screens[0];notes.innerHTML=`<span class="feature-status">${s[1]} · feature scope</span><strong>Working in this prototype</strong><p>${s[2]}</p><strong>To implement in the iOS app</strong><p>${s[3]}</p>`;header.querySelectorAll('[data-pick]').forEach(b=>{b.classList.toggle('chosen',b.dataset.pick===current);b.setAttribute('aria-pressed',String(b.dataset.pick===current));});
if(current==='Expense'){const fields=main.querySelectorAll('input');fields[0].id='expense-description';fields[1].id='expense-amount';const save=main.querySelector('.primary');save.removeAttribute('data-go');save.dataset.saveExpense='1';save.textContent='Save expense';}
if(current==='Budget'){const total=248+expenses.reduce((a,e)=>a+e.amount,0);main.querySelector('.balance').textContent='$'+(600-total).toFixed(2);main.querySelector('.hero p').textContent='$'+total.toFixed(2)+' spent of $600 planned';main.querySelector('.track span').style.width=Math.min(100,total/6)+'%';main.querySelector('.list').insertAdjacentHTML('beforeend',expenses.map(e=>`<div class="item"><div class="grow"><strong>${escape(e.name)}</strong><small>${escape(e.category)} · Just added</small></div><strong>$${e.amount.toFixed(2)}</strong></div>`).join(''));}
if(current==='Records'&&expenses.length){const budget=main.querySelector('[data-go="Budget"] small');if(budget)budget.textContent='$'+(248+expenses.reduce((a,e)=>a+e.amount,0)).toFixed(2)+' of $600 used';}
if(current==='Today'){main.querySelectorAll('.item').forEach(label=>{const text=label.querySelector('strong'),sub=label.querySelector('.grow small');if(text?.textContent==='Read together'){text.textContent='Read and reflect';sub.textContent='Emma · English I · Short story';}if(text?.textContent==='Fractions in everyday life'){text.textContent='Linear equations';sub.textContent='Emma · Algebra I · Lesson 24';}});}
}
function go(name){const b=header.querySelector(`[data-pick="${name}"]`);b.click();}
r.addEventListener('click',e=>{const save=e.target.closest('[data-save-expense]');if(save){e.stopImmediatePropagation();const name=main.querySelector('#expense-description').value.trim(),amount=Number(main.querySelector('#expense-amount').value.replace(/[$,]/g,''));if(!name||!Number.isFinite(amount)||amount<=0){let error=main.querySelector('[role="alert"]');if(!error){error=document.createElement('p');error.setAttribute('role','alert');main.append(error);}error.textContent='Enter a description and an amount greater than zero.';return;}expenses.push({name,amount,category:main.querySelector('select').value});go('Budget');return;}const target=e.target.closest('[data-go]');if(target){current=target.dataset.go;if(!gallery){phone.hidden=false;notes.hidden=false;overview.hidden=true;}}},true);
r.addEventListener('click',e=>{if(e.target.closest('[data-go]'))update();});
r.addEventListener('click',e=>{const mode=e.target.closest('[data-mode]');if(!mode)return;gallery=mode.dataset.mode==='overview';if(gallery){overview.innerHTML='';const before=current;for(const s of screens){go(s[0]);const section=document.createElement('section'),title=document.createElement('h2');title.textContent=s[1];section.append(title);const copy=phone.cloneNode(true);copy.hidden=false;copy.setAttribute('inert','');copy.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));section.append(copy);overview.append(section);}go(before);phone.hidden=true;notes.hidden=true;overview.hidden=false;}else{phone.hidden=false;notes.hidden=false;overview.hidden=true;go(current);}});
header.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>{if(gallery){gallery=false;overview.hidden=true;phone.hidden=false;notes.hidden=false;}}));update();
})();
</script>
